version: 2
updates:
  # GitHub Actions are pinned to commit hashes; Dependabot updates hash and version
  # comment together, grouped into one pull request per month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Pinned test and lint tools (requirements_test.txt, requirements_lint.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      python-tools:
        patterns: ["*"]
